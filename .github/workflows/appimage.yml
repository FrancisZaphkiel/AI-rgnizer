name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # La más antigua disponible: la AppImage funciona con la glibc del sistema de
    # construcción o una más nueva.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Bibliotecas del sistema que usa Qt (para la comprobación de ldd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils libegl1 libgl1 \
            libopengl0 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libfreetype6 \
            libdbus-1-3 libglib2.0-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libmagic1
      - run: packaging/appimage/build.sh
      - name: Prueba de humo
        run: |
          app=$(ls dist/AI-rgnizer-*-x86_64.AppImage)
          "$app" --appimage-extract-and-run --version
          QT_QPA_PLATFORM=offscreen "$app" --appimage-extract-and-run paths
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: dist/*.AppImage
      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
